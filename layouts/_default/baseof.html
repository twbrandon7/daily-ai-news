<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ "css/index.css" | relURL }}">
</head>
<body class="layer-0">
  <header class="site-header">
    {{ block "header" . }}
    <a href="{{ "/" | relLangURL }}" class="site-title">{{ .Site.Title }}</a>
    <div class="header-actions">
      {{ block "lang-switcher" . }}
          {{- $currentLang := .Site.Language.Lang -}}
          {{- $enURL := replace .RelPermalink "/zh-tw/" "/en/" -}}
          {{- $zhURL := replace .RelPermalink "/en/" "/zh-tw/" -}}
          <a href="{{ $enURL }}"
             class="btn-ghost{{ if eq $currentLang "en" }} btn-ghost--active{{ end }}"
             hreflang="en"
             aria-label="{{ if eq $currentLang "en" }}English (current language){{ else }}Switch to English{{ end }}">EN</a>
          <span class="lang-switcher-divider" aria-hidden="true"></span>
          <a href="{{ $zhURL }}"
             class="btn-ghost{{ if eq $currentLang "zh-tw" }} btn-ghost--active{{ end }}"
             hreflang="zh-TW"
             aria-label="{{ if eq $currentLang "zh-tw" }}繁體中文（目前語言）{{ else }}切換至繁體中文{{ end }}">TW</a>
          {{ end }}
    </div>
    {{ end }}
  </header>
  <div class="site-content">
    {{ block "main" . }}{{ end }}
  </div>
  <script src="{{ "js/main.js" | relURL }}" defer></script>
</body>
</html>
